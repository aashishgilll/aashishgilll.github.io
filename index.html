<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aashish Gill | Creative Director & Designer — New Delhi</title>
    <meta name="description" content="Aashish Gill is a New Delhi based creative director and designer working across film, digital design and visual storytelling.">
    <meta name="author" content="Aashish Gill">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://www.aashishgill.com/">

    <meta property="og:type" content="website">
    <meta property="og:url" content="https://www.aashishgill.com/">
    <meta property="og:title" content="Aashish Gill | Creative Director & Designer">
    <meta property="og:description" content="New Delhi based creative director working across film, digital design and visual storytelling.">
    <meta property="og:image" content="https://www.aashishgill.com/assets/top-image.jpg">

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Aashish Gill",
      "url": "https://www.aashishgill.com/",
      "image": "https://www.aashishgill.com/assets/AASHISH_LOGO-8.png",
      "jobTitle": "Creative Director",
      "address": { "@type": "PostalAddress", "addressLocality": "New Delhi", "addressCountry": "IN" },
      "email": "gillaashishh@gmail.com",
      "sameAs": ["https://www.instagram.com/ahsheeshhh"]
    }
    </script>

    <link rel="preload" href="assets/AASHISH_LOGO-8.png" as="image">
    <!-- Jost = Futura-style fallback for devices without Futura (Windows/Android) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@700&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root { --easing: cubic-bezier(0.16, 1, 0.3, 1); }

        html, body { height: 100%; }

        body {
            background-color: #f5f4f0;
            color: #000;
            font-family: "Futura", "Futura PT", "Jost", "Century Gothic", "Trebuchet MS", sans-serif;
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
            cursor: none;
        }

        a { color: #fff; text-decoration: none; cursor: none; }

        ::selection { background: #000; color: #fff; }

        /* --- BUNNY CURSOR --- */
        #bunny-cursor {
            position: fixed;
            pointer-events: none;
            z-index: 99999;
            width: 72px;
            height: 72px;
            transform: translate(-50%, -50%);
            transition: transform 0.15s var(--easing);
            will-change: left, top;
            left: -100px;
            top: -100px;
        }
        #bunny-cursor img { width: 100%; height: 100%; object-fit: contain; }
        #bunny-cursor.hovering { transform: translate(-50%, -50%) scale(1.2) rotate(-8deg); }
        #bunny-cursor.clicking { transform: translate(-50%, -50%) scale(0.85) rotate(6deg); }

        @media (hover: none) {
            #bunny-cursor { display: none; }
            body, a { cursor: auto; }
        }

        /* --- VIDEO BG --- */
        .video-bg-fixed {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: -2;
            overflow: hidden;
            background-color: #f5f4f0;
            background-image: url('assets/background-poster.jpg');
            background-size: cover;
            background-position: center;
        }
        .video-bg-fixed::after {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(245,244,240,0.55);
        }
        .video-bg-fixed video {
            width: 100%; height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 0.8s ease;
        }
        .video-bg-fixed video.loaded { opacity: 1; }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: -1;
            opacity: 0.025;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
            background-repeat: repeat;
            background-size: 200px 200px;
        }

        /* --- LOGO: TOP CENTRE --- */
        .logo-top {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            padding-top: clamp(1.2rem, 3vh, 2.4rem);
            z-index: 10;
        }

        .logo {
            width: clamp(64px, 8vw, 96px);
            height: auto;
            object-fit: contain;
            opacity: 0;
            animation: fadeUp 1s var(--easing) 0.2s forwards;
        }

        /* --- CENTRE: GET IN TOUCH* --- */
        .stage {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .touch-link {
            display: inline-block;
            white-space: nowrap;
            font-family: "Futura", "Futura PT", "Jost", "Century Gothic", "Trebuchet MS", sans-serif;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.02em;
            line-height: 1;
            font-size: 28px; /* replaced by script to hit the target width */
            color: #fff;
            opacity: 0;
            animation: fadeUp 1s var(--easing) 0.5s forwards;
            transition: opacity 0.25s ease;
        }
        .touch-link:hover { opacity: 0.5 !important; }
        .touch-link:focus-visible { outline: 2px solid #fff; outline-offset: 8px; }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @media (prefers-reduced-motion: reduce) {
            .logo, .touch-link { animation: none; opacity: 1; }
        }
    </style>
</head>
<body>

    <div id="bunny-cursor">
        <img src="assets/Black_and_white_bunny-Photoroom.png" alt="">
    </div>

    <div class="video-bg-fixed">
        <video id="bg-video" loop muted playsinline preload="none" poster="assets/background-poster.jpg">
            <source data-src="assets/background-loop.mp4" type="video/mp4">
        </video>
    </div>

    <div class="logo-top">
        <img class="logo" src="assets/AASHISH_LOGO-8.png" alt="Aashish Gill logo">
    </div>

    <main class="stage">
        <a class="touch-link" id="touch-link" href="mailto:gillaashishh@gmail.com">Get in touch*</a>
    </main>

    <script>
        /* ---- SIZE "GET IN TOUCH*" ----
           Phone  (<=768px): about 5 cm wide  -> 72% of screen width
           Laptop (>768px) : about 10 cm wide -> 10 CSS cm                */
        const touchLink = document.getElementById('touch-link');
        function fitTouchLink() {
            const isPhone = window.matchMedia('(max-width: 768px)').matches;
            const targetPx = isPhone ? window.innerWidth * 0.72 : 10 * 37.7953;
            touchLink.style.fontSize = '100px';
            const w = touchLink.offsetWidth;
            touchLink.style.fontSize = (100 * targetPx / w) + 'px';
        }
        fitTouchLink();
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitTouchLink);
        window.addEventListener('load', fitTouchLink);
        window.addEventListener('resize', fitTouchLink);

        /* ---- BACKGROUND VIDEO ---- */
        const bgVideo = document.getElementById('bg-video');
        const loadBgVideo = () => {
            const source = bgVideo.querySelector('source');
            source.src = source.dataset.src;
            bgVideo.load();
            bgVideo.play().catch(() => {});
            bgVideo.addEventListener('canplay', () => bgVideo.classList.add('loaded'), { once: true });
        };
        if (document.readyState === 'complete') {
            setTimeout(loadBgVideo, 200);
        } else {
            window.addEventListener('load', () => setTimeout(loadBgVideo, 200));
        }

        /* ---- BUNNY CURSOR ---- */
        const bunny = document.getElementById('bunny-cursor');
        document.addEventListener('mousemove', e => {
            bunny.style.left = e.clientX + 'px';
            bunny.style.top = e.clientY + 'px';
        });
        document.addEventListener('mousedown', () => { bunny.classList.remove('hovering'); bunny.classList.add('clicking'); });
        document.addEventListener('mouseup', () => bunny.classList.remove('clicking'));
        document.querySelectorAll('a').forEach(el => {
            el.addEventListener('mouseenter', () => bunny.classList.add('hovering'));
            el.addEventListener('mouseleave', () => bunny.classList.remove('hovering'));
        });
    </script>
</body>
</html>
